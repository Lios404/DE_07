version: 2

models:
  - name: stg_checkout_success_cart_items
    description: >
      Grain: 1 dong = 1 san pham (product line item) trong 1 lan checkout thanh cong,
      SAU KHI da dedupe theo (order_id, product_id) de loai bo duplicate tracking event.
      Business key: order_id + product_id (khong phai Mongo _id).
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: event_timestamp
        tests: [not_null]

  - name: stg_products
    description: "1 dong = 1 san pham, gender da duoc normalize tu 22 gia tri distinct thuc te."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_gender
        tests:
          - accepted_values:
              values: ['Female', 'Male', 'Kids', 'Unknown']

  - name: stg_store
    description: "1 dong = 1 store_id, kem domain pho bien nhat suy luan tu current_url."
    columns:
      - name: store_id
        tests: [not_null, unique]

  - name: stg_currency
    description: "1 dong = 1 ky hieu tien te distinct tim thay trong cart_products, da map sang ma ISO."
    columns:
      - name: currency_code
        tests: [not_null]

  - name: stg_location
    description: "1 dong = 1 IP distinct tu raw_ip_location, da chuan hoa TRIM/case cho city/region/country."
    columns:
      - name: ip_address
        tests: [not_null]
